<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f9b76" />
    <title>List Up! — brak połączenia</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f7f9f6;
        color: #24322d;
      }
      main {
        width: min(86vw, 360px);
        padding: 32px;
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 14px 36px rgb(15 155 118 / 20%);
      }
      h1 {
        margin: 24px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: #60706a;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #171c1a;
          color: #f4f7f5;
        }
        p {
          color: #aeb9b4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>Jesteś offline</h1>
      <p>Po odzyskaniu połączenia odśwież stronę, aby wrócić do swoich list.</p>
    </main>
  </body>
</html>
