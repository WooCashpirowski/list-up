name: list-up-frontend
services:
    frontend:
        build:
            context: .
            target: development
        init: true
        ports:
            - '127.0.0.1:3000:3000'
        env_file: .env.local
        environment:
            SUPABASE_URL: http://host.docker.internal:44321
            NEXT_TELEMETRY_DISABLED: '1'
            WATCHPACK_POLLING: 'true'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - ./app:/app/app:ro
            - ./components:/app/components:ro
            - ./lib:/app/lib:ro
            - ./src:/app/src:ro
            - ./public:/app/public:ro
            - ./next.config.mjs:/app/next.config.mjs:ro
            - ./tsconfig.json:/app/tsconfig.json:ro
            - frontend_next:/app/.next
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 10s
            start_period: 120s
            retries: 6
volumes:
    frontend_next:
